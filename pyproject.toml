[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-invariant-eval"
version = "0.2.0"
description = "Deterministic, fail-closed governance and evaluation engine for multi-agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sankaranainar Parmasivan" }]
requires-python = ">=3.12"
keywords = ["agents", "evaluation", "governance", "opentelemetry", "pci", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[project.urls]
Repository = "https://github.com/sankaranainar-p/agent-invariant-eval"
Issues = "https://github.com/sankaranainar-p/agent-invariant-eval/issues"
Changelog = "https://github.com/sankaranainar-p/agent-invariant-eval/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples/payment_dispute_agent"]
addopts = "-q"
