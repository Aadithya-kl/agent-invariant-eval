[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-invariant-eval"
version = "0.3.0"
description = "Deterministic, fail-closed governance and evaluation engine for multi-agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sankaranainar Paramasivan" }]
requires-python = ">=3.11"
keywords = ["agents", "evaluation", "governance", "opentelemetry", "pci", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
all = ["agent-invariant-eval[cli,otlp]"]
dev = [
    "agent-invariant-eval[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[project.urls]
Repository = "https://github.com/sankaranainar-p/agent-invariant-eval"
Issues = "https://github.com/sankaranainar-p/agent-invariant-eval/issues"
Changelog = "https://github.com/sankaranainar-p/agent-invariant-eval/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples/payment_dispute_agent"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
